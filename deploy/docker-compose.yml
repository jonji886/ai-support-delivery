services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-demo}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OBSERVABILITY_DB_PATH: ${OBSERVABILITY_DB_PATH:-runtime/observability.db}
      OBSERVABILITY_INCLUDE_ERROR_MESSAGES: ${OBSERVABILITY_INCLUDE_ERROR_MESSAGES:-false}
      POLICY_MIN_EVIDENCE_SCORE: ${POLICY_MIN_EVIDENCE_SCORE:-0.65}
      POLICY_MIN_VECTOR_SCORE: ${POLICY_MIN_VECTOR_SCORE:-0.35}
      RAG_RETRIEVAL_STRATEGY: ${RAG_RETRIEVAL_STRATEGY:-fusion}
    volumes:
      - runtime-data:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ../apps/web:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  runtime-data:
